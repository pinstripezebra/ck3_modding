 # Trait names and descriptions
 trait_ascendant_lore_of_fire:0 "Master Fire Mage"
 trait_ascendant_lore_of_fire_desc:0 "This mage has transcended the ordinary boundaries of pyromancy. Where other fire-lore practitioners command flame, this one has become one with it — a living conduit of ancient conflagration whose very presence radiates heat and power."

 trait_ascendant_lore_of_earth:0 "Master Earth Mage"
 trait_ascendant_lore_of_earth_desc:0 "Stone, soil, and root answer this mage's call as naturally as breathing. Through decades of study the Master Earth Mage has merged their will with the deep places of the world, drawing strength that outlasts any mortal fortification."

 trait_ascendant_lore_of_water:0 "Master Water Mage"
 trait_ascendant_lore_of_water_desc:0 "The currents of every ocean and river have passed through this mage's understanding. A Master Water Mage reads the flow of fate as easily as a sailor reads the tide, and heals wounds that would fell lesser practitioners."

 trait_ascendant_lore_of_death:0 "Master Death Mage"
 trait_ascendant_lore_of_death_desc:0 "This mage has stared into the void beyond life and returned — changed. A Master Death Mage neither fears the grave nor hurries toward it, wielding necrotic power that grants a terrible resilience against mortal frailty."

 trait_ascendant_lore_of_high_magic:0 "Master of High Magic"
 trait_ascendant_lore_of_high_magic_desc:0 "The supreme achievement of arcane study. A Master of High Magic has unified all strands of magical theory into a single coherent understanding, their mind and body forged by the raw weight of boundless knowledge."

 # Interaction names and descriptions
 wizard_ascend_lore_fire:0 "Attempt Fire Ascension"
 wizard_ascend_lore_fire_interaction_desc:0 "You have mastered every facet of the Lore of Fire. With great focus and risk, you may attempt the ritual of Ascension — a chance to transcend ordinary mastery and become a true Ascendant of Fire. Success depends on your Learning and magical education.\n\nChance of success: [20|E]%–[80|E]%"

