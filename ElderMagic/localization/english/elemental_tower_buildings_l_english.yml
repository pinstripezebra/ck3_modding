l_english:
 building_type_elemental_tower_1:0 "Elemental Haven"
 building_type_elemental_tower_1_desc:0 "A modest academy set away from noisy settlements where budding scholars learn to kindle small sparks, shape gentle currents, and harmonize with local spirits."
 building_type_elemental_tower_2:0 "Spire of the Four Winds"
 building_type_elemental_tower_2_desc:0 "A tall stone observatory where battle-mages and scholars tap into atmospheric currents and geological forces to defend the realm and enrich local agriculture."
 building_type_elemental_tower_3:0 "Prismatic College"
 building_type_elemental_tower_3_desc:0 "A bustling center of higher arcane learning. Specialized faculties master earth, storm, wave, and flame, training archmages capable of turning the tides of war."
 building_type_elemental_tower_4:0 "High Academy of Elementalism"
 building_type_elemental_tower_4_desc:0 "A grand, marble-walled sanctuary adorned with floating conduits and shimmering wards, housing vast libraries and powerful ritual chambers that bend elemental forces on a regional scale."
 building_type_elemental_tower_5:0 "Grand Citadel of the Prime Elements"
 building_type_elemental_tower_5_desc:0 "An awe-inspiring nexus of raw magical power that pierces the clouds. Fusing all primary forces into absolute harmony, it radiates cosmic brilliance, making the realm an unassailable bastion of arcana."
