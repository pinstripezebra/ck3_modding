l_english:
 building_type_necromancer_sanctum_1:0 "Necromancer Sanctum"
 building_type_necromancer_sanctum_1_desc:0 "A duchy-spanning seat of forbidden study, where necromancers bind the dead to service and bend the boundary between life and death to their will. Settlements with this building can host a University of Magic Visit."

 building_necromancer_sanctum_1:0 "Ossuary Sanctum"
 building_necromancer_sanctum_1_desc:0 "A secluded retreat where dark scholars carve wards into bone and channel the faint murmurs of the freshly deceased. It serves as a humble foundation for gathering reanimated labor and minor offensive magic."
 building_necromancer_sanctum_2:0 "Catacomb Crypts"
 building_necromancer_sanctum_2_desc:0 "Expanded subterranean galleries choked with dead-smothered silence and incense. Here, corpses are systematically processed, preserved, and drilled to march as tireless laborers and shock troops."
 building_necromancer_sanctum_3:0 "Mortuary Spire"
 building_necromancer_sanctum_3_desc:0 "A dark tower piercing the sky, crowned with obsidian conduits that siphon Death-realm winds. High necromancers gather here to command legions of undeath and extend their cabal's political influence."
 building_necromancer_sanctum_4:0 "Dread Necropolis"
 building_necromancer_sanctum_4_desc:0 "A sprawling, silent city built atop thousands of mass graves. Its grand avenues echo with dark incantations, serving as a bastion where liches command vast deathless armies and weave realm-wide curses."
 building_necromancer_sanctum_5:0 "Apex Ziggurat of the Black Sun"
 building_necromancer_sanctum_5_desc:0 "A monumental necromantic pyramid forged from soul-bound stone and dark Leyline energy. It radiates an oppressive aura of mortality, granting its master absolute dominion over life, death, and the surrounding mortal realms."
