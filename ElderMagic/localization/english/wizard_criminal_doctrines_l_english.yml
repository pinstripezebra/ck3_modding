l_english:
 doctrine_elemental_magic_name:0 "Elemental Magic"
 doctrine_elemental_magic_crime_name:0 "Criminal"
 doctrine_elemental_magic_crime_desc:0 "To bend fire, earth, water, and wind to one's will is to steal what belongs to nature and the divine alike. Elemental sorcery is an outrage against the natural order, and those who practice it must be hunted down and punished."
 doctrine_elemental_magic_shunned_name:0 "Shunned"
 doctrine_elemental_magic_shunned_desc:0 "The elements answer to no mortal hand. Those who claim to command fire and storm are, at best, deluded charlatans and, at worst, dangerous fools - better avoided than embraced."
 doctrine_elemental_magic_accepted_name:0 "Accepted"
 doctrine_elemental_magic_accepted_desc:0 "Fire, earth, water, and wind are forces to be studied and shaped like any other craft. Those with the gift to master them are welcomed as scholars and artisans of a practical trade."
 doctrine_elemental_magic_virtuous_name:0 "Virtuous"
 doctrine_elemental_magic_virtuous_desc:0 "To command the elements is to walk hand in hand with creation itself. Elemental mages are revered as guardians of the natural world, their gifts celebrated as a blessing upon our people."
 doctrine_parameter_elemental_magic_illegal:0 "Characters with a Lore of Fire, Lore of Earth, or Lore of Water [trait|E] are [criminals|E]"
 doctrine_parameter_elemental_magic_shunned:0 "Characters with a Lore of Fire, Lore of Earth, or Lore of Water [trait|E] are [shunned|E]"
 doctrine_parameter_elemental_magic_accepted:0 "Characters with a Lore of Fire, Lore of Earth, or Lore of Water [trait|E] are fully accepted"
 elemental_magic_illegal_name:0 "Criminal Elemental Magic Doctrine"
 elemental_magic_shunned_name:0 "Shunned Elemental Magic Doctrine"

 doctrine_dark_magic_name:0 "Dark Magic"
 doctrine_dark_magic_crime_name:0 "Criminal"
 doctrine_dark_magic_crime_desc:0 "To traffic with death and raise the dead from their rest is an abomination before the living and the divine alike. Dark sorcery is outlawed without exception, and its practitioners are to be rooted out and destroyed."
 doctrine_dark_magic_shunned_name:0 "Shunned"
 doctrine_dark_magic_shunned_desc:0 "Death is not a servant to be commanded. Those who dabble in dark sorcery are viewed with dread and suspicion, tolerated only so long as they keep their grim work far from decent folk."
 doctrine_dark_magic_accepted_name:0 "Accepted"
 doctrine_dark_magic_accepted_desc:0 "The dead need not lie idle when the living have need of them. Necromancy is a grim but legitimate discipline, and those who practice it are afforded the same respect as any other learned craft."
 doctrine_dark_magic_virtuous_name:0 "Virtuous"
 doctrine_dark_magic_virtuous_desc:0 "Death is but another tool to be mastered, and those who master it serve their people well. Necromancers are honored for their unflinching command over the boundary between life and death."
 doctrine_parameter_dark_magic_illegal:0 "Characters with the [GetTrait('lore_of_death').GetName( GetPlayer )] [trait|E] are [criminals|E]"
 doctrine_parameter_dark_magic_shunned:0 "Characters with the [GetTrait('lore_of_death').GetName( GetPlayer )] [trait|E] are [shunned|E]"
 doctrine_parameter_dark_magic_accepted:0 "Characters with the [GetTrait('lore_of_death').GetName( GetPlayer )] [trait|E] are fully accepted"
 dark_magic_illegal_name:0 "Criminal Dark Magic Doctrine"
 dark_magic_shunned_name:0 "Shunned Dark Magic Doctrine"
