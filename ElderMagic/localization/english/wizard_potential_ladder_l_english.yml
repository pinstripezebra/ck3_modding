l_english:
 trait_the_spark:0 "Latent Potential"
 trait_the_spark_desc:0 "A faint magical spark stirs within this character, but it is unstable and difficult to control. Their journey into arcane mastery has only just begun. #italic[Generates +1 mana per month.]!"
 trait_the_conduit:0 "Apprentice Potential"
 trait_the_conduit_desc:0 "This character can channel small currents of mana with growing confidence. Their control remains uneven, but genuine progress is clear. #italic[Generates +2 mana per month.]!"
 trait_the_resonator:0 "Journeyman Potential"
 trait_the_resonator_desc:0 "This character now resonates with magic more naturally, shaping power with reliable discipline. Their foundations are strong enough for advanced study. #italic[Generates +4 mana per month.]!"
 trait_the_vector:0 "Adept Potential"
 trait_the_vector_desc:0 "This character directs magical force with speed and precision. Their command of arcane flow marks them as a serious practitioner. #italic[Generates +6 mana per month.]!"
 trait_the_capacitor:0 "Master Potential"
 trait_the_capacitor_desc:0 "This character stores and releases large reserves of mana with practiced ease. Their magical endurance and control are exceptional. #italic[Generates +8 mana per month.]!"
 trait_the_dynamo:0 "Grandmaster Potential"
 trait_the_dynamo_desc:0 "This character sustains intense magical output without faltering. Their arcane presence is formidable and difficult to match. #italic[Generates +10 mana per month.]!"
 trait_the_nexus:0 "Archmage Potential"
 trait_the_nexus_desc:0 "This character acts as a nexus for converging magical forces. Lesser energies seem to align around their will. #italic[Generates +12 mana per month.]!"
 trait_the_singularity:0 "Monarch Potential"
 trait_the_singularity_desc:0 "This character compresses tremendous arcane power into perfect focus. Their magic carries the authority of a sovereign force. #italic[Generates +14 mana per month.]!"
 trait_the_catalyst:0 "Demigod Potential"
 trait_the_catalyst_desc:0 "This character can transform even a minor spark into overwhelming magical impact. Their power feels close to the divine. #italic[Generates +16 mana per month.]!"
 trait_the_horizon:0 "Godlike Potential"
 trait_the_horizon_desc:0 "This character commands magic on a near-mythic scale. Their potential appears limitless to all who witness their power. #italic[Generates +20 mana per month.]!"

