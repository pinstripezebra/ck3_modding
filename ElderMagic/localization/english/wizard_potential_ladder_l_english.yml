l_english:
 trait_the_spark:0 "Latent Potential"
 trait_the_spark_desc:0 "A barely-perceptible flicker of magic — common enough that most will never notice it, yet enough to begin a long journey. Mundane and fragile, it is the humblest start of all arcane paths."
 trait_the_conduit:0 "Apprentice Potential"
 trait_the_conduit_desc:0 "The raw channel has opened and mana flows, however unevenly. Such students are found in every hall of learning, but few ever push further than this."
 trait_the_resonator:0 "Journeyman Potential"
 trait_the_resonator_desc:0 "Magic resonates reliably through this practitioner, marking them as a capable and respected wielder. They are uncommon — one in many villages might reach this level."
 trait_the_vector:0 "Adept Potential"
 trait_the_vector_desc:0 "This character directs arcane force with notable speed and precision, placing them among the serious practitioners of any realm. Such talent is rare outside dedicated orders."
 trait_the_capacitor:0 "Master Potential"
 trait_the_capacitor_desc:0 "A deep well of magical endurance and control — the mark of a true master, achieved only through exceptional dedication. Most courts have never hosted a practitioner of this calibre."
 trait_the_dynamo:0 "Grandmaster Potential"
 trait_the_dynamo_desc:0 "A sustained and formidable arcane presence that commands fear and respect in equal measure. Grandmasters are spoken of across generations; entire academies are founded in their names."
 trait_the_nexus:0 "Archmage Potential"
 trait_the_nexus_desc:0 "At this tier, lesser magical forces seem to align and bend around the wielder's will. Archmages are legendary figures — there may be only a handful alive in the entire world at any time."
 trait_the_singularity:0 "Monarch Potential"
 trait_the_singularity_desc:0 "Magic of sovereign authority — compressed to a point of near-perfect focus that reshapes the world at its bearer's command. Such power appears perhaps once in a century."
 trait_the_catalyst:0 "Demigod Potential"
 trait_the_catalyst_desc:0 "The boundary between mortal and divine begins to blur. This character's capacity to transform reality through magic is so vast it feels close to the sacred — or the terrifying."
 trait_the_horizon:0 "Godlike Potential"
 trait_the_horizon_desc:0 "The horizon of what mortals can achieve with magic. This character's power appears limitless to all who witness it, and their name will be written into the oldest legends of the world."

 # Compatibility aliases in case a UI context resolves non-trait-prefixed keys.
 the_spark:0 "Latent Potential"
 the_spark_desc:0 "$trait_the_spark_desc$"
 the_conduit:0 "Apprentice Potential"
 the_conduit_desc:0 "$trait_the_conduit_desc$"
