l_english:
 building_type_wizard_tower_01:0 "Wizard Tower"
 building_type_wizard_tower_01_desc:0 "A modest stone tower has been erected at the heart of the duchy, its walls faintly humming with arcane energies. Scholars and traders are drawn to the area, bringing new wealth and growth."
 building_type_wizard_tower_02:0 "Wizard Tower"
 building_type_wizard_tower_02_desc:0 "The tower has been expanded, its arcane library now housing dozens of magical texts and its halls filled with apprentice mages. Prosperity follows those who dwell and study within."
 building_type_wizard_tower_03:0 "Wizard Tower"
 building_type_wizard_tower_03_desc:0 "A grand spire of magical power dominates the duchy skyline. Mages and merchants from across the realm are drawn to its light, and the county flourishes under arcane influence."
 building_type_wizard_tower_04:0 "Wizard Tower"
 building_type_wizard_tower_04_desc:0 "The tower has grown into a true citadel of arcane learning. Its vast halls house councils of sorcerers whose combined knowledge reshapes the prosperity and growth of the entire region."
 building_type_wizard_tower_05:0 "Wizard Tower"
 building_type_wizard_tower_05_desc:0 "The pinnacle of magical architecture. This legendary tower stands as the greatest center of arcane power in the known world, channeling mystical energies that bring unparalleled wealth and swift development to the duchy."