l_english:
 wizard_wardship_toast_title:0 "Magical Upbringing"
 wizard_wardship_toast_fire_desc:0 "[ROOT.GetFirstName] has absorbed the principles of pyromancy from their guardian's tutelage, awakening the Lore of Fire within them."
 wizard_wardship_toast_earth_desc:0 "[ROOT.GetFirstName] has learned the slow, enduring wisdom of stone from their guardian's teachings, awakening the Lore of Earth within them."
 wizard_wardship_toast_water_desc:0 "[ROOT.GetFirstName] has absorbed the flowing mysteries of water from their guardian's tutelage, awakening the Lore of Water within them."
 wizard_wardship_toast_death_desc:0 "[ROOT.GetFirstName] has glimpsed the boundary between the living and dead under their guardian's guidance, awakening the Lore of Death within them."
 wizard_wardship_toast_high_magic_desc:0 "[ROOT.GetFirstName] has begun to grasp the unified theory of arcane forces through their guardian's teachings, awakening the Lore of High Magic within them."

 wizard_wardship.0002.t:0 "A Mage Comes of Age"
 wizard_wardship.0002.desc:0 "Years spent learning at the feet of your guardian have prepared you well. The arcane principles woven into your upbringing have taken root, awakening a true Lore of Magic within you on this, your sixteenth year."
 wizard_wardship.0002.a:0 "My guardian's teachings have made me what I am."

 wizard_wardship_guardian_hint_title:0 "A Question of Tutelage"
 wizard_wardship_guardian_hint_desc:0 "Your lore of magic can only pass to children of your own blood automatically. Other young wards or hostages in your court must first be formally designated your Ward (via the 'Designate Guardian and Ward' interaction) before your teachings can awaken magic within them."
 wizard_wardship_diag_has_mother:0 "[DIAG] has mother scope"
 wizard_wardship_diag_has_father:0 "[DIAG] has father scope"
 wizard_wardship_diag_has_guardian_rel:0 "[DIAG] has_relation type=guardian exists"
 wizard_wardship_diag_guardian_has_lore:0 "[DIAG] guardian relation has a lore trait"
 wizard_wardship_diag_mother_has_lore:0 "[DIAG] mother has a lore trait"
 wizard_wardship_diag_father_has_lore:0 "[DIAG] father has a lore trait"
